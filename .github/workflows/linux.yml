# Builds Plain Office for Linux phones and computers.
# - smoke-test: runs the real app on Ubuntu and checks it starts and can open an editor
# - flatpak:    Flatpak bundles for phones (aarch64) and PCs (x86_64)
# - tarball:    the app files plus install.sh, for installing without Flatpak
# On a version tag (v1.2.0...) the files are attached to that GitHub release.
name: Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the builds to this existing release tag (optional, e.g. v1.1.0)
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  smoke-test:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - name: Install GTK 4, libadwaita and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 xvfb dbus-x11
      - name: Start the app and open an editor
        env:
          PLAIN_OFFICE_WEB: dist
          PLAIN_OFFICE_SMOKE_TEST: '1'
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          # The CI machine can't run WebKit's sandbox; real phones keep it on.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: timeout 180 dbus-run-session -- xvfb-run -a python3 linux/plain_office.py | tee smoke.log; grep -q '"editor":true' smoke.log

  flatpak:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PlainOffice-${{ matrix.arch }}.flatpak
          manifest-path: linux/org.plainoffice.PlainOffice.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: true

  tarball:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - name: Package
        run: |
          mkdir -p pkg/plain-office
          cp linux/plain_office.py linux/install.sh linux/org.plainoffice.PlainOffice.desktop pkg/plain-office/
          cp assets/icon-square.svg pkg/plain-office/icon.svg
          cp -r dist pkg/plain-office/web
          tar -C pkg -czf PlainOffice-portable.tar.gz plain-office
      - uses: actions/upload-artifact@v4
        with:
          name: PlainOffice-portable.tar.gz
          path: PlainOffice-portable.tar.gz

  release:
    needs: [smoke-test, flatpak, tarball]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          find out -name '*.flatpak' -o -name '*.tar.gz' | while read -r f; do
            base=$(basename "$f")
            cp "$f" "PlainOffice-$VERSION-linux-${base#PlainOffice-}"
          done
          ls -la PlainOffice-*
          gh release upload "$TAG" PlainOffice-*-linux-* --clobber --repo "$GITHUB_REPOSITORY"
