# Plain Office for Windows: a small Tauri app around the Plain Office web app,
# using Windows' own WebView2. Build: see windows/README.md.
[package]
name = "plain-office"
version = "1.3.0"
description = "Plain Office: private office suite"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
